<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Игры и Учеба 🚀</title>
    <style>
        :root {
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --success: #10b981;
            --error: #ef4444;
            --bg-gradient: linear-gradient(135deg, #fbcfe8 0%, #f3e8ff 50%, #e0e7ff 100%);
            --card-bg: #ffffff;
            --text-main: #581c87;
            --radius: 24px;
            --shadow: 0 10px 25px -5px rgba(168, 85, 247, 0.15), 0 8px 10px -6px rgba(168, 85, 247, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.2rem;
            color: #7e22ce;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(126, 34, 206, 0.1);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 22px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #7e22ce;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: #f3e8ff;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #d946ef, #a855f7);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 6px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 15px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 35px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid transparent;
        }

        .category-card:nth-child(1) { border-color: #f472b6; background: linear-gradient(135deg, #ffffff 0%, #fdf2f8 100%); }
        .category-card:nth-child(2) { border-color: #c084fc; background: linear-gradient(135deg, #ffffff 0%, #faf5ff 100%); }
        .category-card:nth-child(3) { border-color: #e879f9; background: linear-gradient(135deg, #ffffff 0%, #fdf4ff 100%); }
        .category-card:nth-child(4) { border-color: #fb7185; background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%); }

        .category-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 15px 30px rgba(168, 85, 247, 0.2);
        }

        .category-card .icon {
            font-size: 3.5rem;
            margin-bottom: 12px;
            display: inline-block;
        }

        .category-card h3 {
            font-size: 1.4rem;
            color: #7e22ce;
            font-weight: 800;
        }

        .exercises-screen {
            display: none;
        }

        .back-menu-btn {
            background: #ffffff;
            border: 2px solid #e9d5ff;
            padding: 10px 18px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            color: #9333ea;
            transition: all 0.2s;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(147, 51, 234, 0.05);
        }

        .back-menu-btn:hover {
            background: #9333ea;
            color: white;
            border-color: #9333ea;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 18px;
            border: 2px solid #f3e8ff;
            transition: all 0.2s;
        }

        .exercise-card:hover {
            border-color: #c084fc;
            background: #faf5ff;
            transform: translateX(6px);
        }

        .exercise-card .ex-icon {
            font-size: 2.2rem;
            background: #f3e8ff;
            padding: 12px;
            border-radius: 16px;
        }

        .exercise-card h4 {
            font-size: 1.3rem;
            color: #7e22ce;
            font-weight: 700;
        }

        .rewards-section {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 20px;
            margin-top: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .rewards-section h3 {
            color: #7e22ce;
            margin-bottom: 8px;
        }

        .rewards-grid {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .reward-badge {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.3s;
        }

        .reward-badge.unlocked {
            opacity: 1;
            filter: grayscale(0);
            background: linear-gradient(135deg, #fef08a, #fde047);
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(250, 204, 21, 0.4);
        }

        .game-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: var(--shadow);
            display: none;
            position: relative;
        }

        .question-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .question-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #7e22ce;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .speak-btn {
            background: linear-gradient(135deg, #d946ef, #9333ea);
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.6rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            box-shadow: 0 6px 15px rgba(168, 85, 247, 0.4);
        }

        .speak-btn:hover {
            transform: scale(1.12);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .option-card {
            background: #faf5ff;
            border: 3px solid #e9d5ff;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .option-card .emoji-icon {
            font-size: 3.5rem;
            margin-bottom: 6px;
        }

        .option-card:hover {
            border-color: #a855f7;
            background: #f3e8ff;
            transform: scale(1.02);
        }

        .option-card.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46;
        }

        .option-card.incorrect {
            background: #ffe4e6 !important;
            border-color: #f43f5e !important;
            color: #9f1239;
        }

        .sentence-drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            min-height: 75px;
            background: #faf5ff;
            border: 3px dashed #d8b4fe;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .word-chip {
            background: #ffffff;
            border: 3px solid #a855f7;
            color: #7e22ce;
            padding: 14px 22px;
            border-radius: 16px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.15);
        }

        .word-chip.used {
            opacity: 0.3;
            pointer-events: none;
            background: #f3e8ff;
            border-color: #e9d5ff;
            color: #a855f7;
        }

        .selected-word-chip {
            background: #a855f7;
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .match-card {
            background: #faf5ff;
            border: 3px solid #e9d5ff;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            font-size: 1.8rem;
            font-weight: 700;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .match-card:hover {
            border-color: #a855f7;
            background: #f3e8ff;
        }

        .match-card.selected {
            border-color: #d946ef;
            background: #fae8ff;
            transform: scale(1.03);
        }

        .match-card.matched {
            opacity: 0.4;
            pointer-events: none;
            background: #d1fae5;
            border-color: #10b981;
        }

        .math-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .reading-text {
            background: #faf5ff;
            border-left: 6px solid #a855f7;
            padding: 20px;
            border-radius: 0 20px 20px 0;
            font-size: 2rem;
            line-height: 1.6;
            margin-bottom: 25px;
            text-align: right;
            direction: rtl;
            font-weight: 700;
            color: #581c87;
        }

        .reading-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .reading-option {
            background: #faf5ff;
            border: 3px solid #e9d5ff;
            padding: 18px 22px;
            border-radius: 16px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            text-align: right;
            direction: rtl;
            transition: all 0.2s;
            color: #581c87;
        }

        .reading-option:hover {
            border-color: #a855f7;
            background: #f3e8ff;
        }

        .reward-popup {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: linear-gradient(135deg, #d946ef, #9333ea);
            color: white;
            padding: 16px 32px;
            border-radius: 35px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 15px 30px rgba(168, 85, 247, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .reward-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="rewardPopup" class="reward-popup">
        <span id="rewardText">🏆 Награда!</span>
    </div>

    <div class="container">
        <header>
            <h1>🌟 Игры и Учеба 🚀</h1>
        </header>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">⭐ <span id="scoreVal">0</span></div>
            <div class="stat-item">🔥 <span id="streakVal">0</span></div>
            <div class="stat-item">🎯 <span id="accuracyVal">100%</span></div>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menuScreen">
            <div class="categories-grid">
                <div class="category-card" onclick="openCategory('english')">
                    <div class="icon">🇬🇧</div>
                    <h3>Английский</h3>
                </div>
                <div class="category-card" onclick="openCategory('hebrew')">
                    <div class="icon">🇮🇱</div>
                    <h3>Иврит</h3>
                </div>
                <div class="category-card" onclick="openCategory('russian')">
                    <div class="icon">🇷🇺</div>
                    <h3>Русский</h3>
                </div>
                <div class="category-card" onclick="openCategory('math')">
                    <div class="icon">🔢</div>
                    <h3>Математика</h3>
                </div>
            </div>

            <div class="rewards-section">
                <h3>🏆 Награды</h3>
                <div class="rewards-grid" id="rewardsGrid">
                    <div class="reward-badge" data-score="30">🥉</div>
                    <div class="reward-badge" data-score="60">🥈</div>
                    <div class="reward-badge" data-score="100">🥇</div>
                    <div class="reward-badge" data-score="150">🦄</div>
                    <div class="reward-badge" data-score="200">🚀</div>
                    <div class="reward-badge" data-score="300">👑</div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН ВЫБОРА УПРАЖНЕНИЙ -->
        <div id="exercisesScreen" class="exercises-screen">
            <button class="back-menu-btn" onclick="returnToMainCategoryMenu()">← Назад</button>
            <h2 id="categoryTitle" style="color: #7e22ce; margin-bottom: 18px; font-size: 1.6rem; font-weight: 800;"></h2>
            <div class="exercise-list" id="exerciseListContainer"></div>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="gameScreen" class="game-container">
            <button class="back-menu-btn" onclick="returnToExercises()">← К списку</button>
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        const englishWords = [
            {en: "Cat", ru: "Кошка", emoji: "🐈", weight: 1}, {en: "Dog", ru: "Собака", emoji: "🐕", weight: 1},
            {en: "Apple", ru: "Яблоко", emoji: "🍎", weight: 1}, {en: "House", ru: "Дом", emoji: "🏠", weight: 1},
            {en: "Sun", ru: "Солнце", emoji: "☀️", weight: 1}, {en: "Car", ru: "Машина", emoji: "🚗", weight: 1},
            {en: "Book", ru: "Книга", emoji: "📖", weight: 1}, {en: "Tree", ru: "Дерево", emoji: "🌳", weight: 1},
            {en: "Water", ru: "Вода", emoji: "💧", weight: 1}, {en: "Milk", ru: "Молоко", emoji: "🥛", weight: 1},
            {en: "Fish", ru: "Рыба", emoji: "🐟", weight: 1}, {en: "Bird", ru: "Птица", emoji: "🐦", weight: 1},
            {en: "Flower", ru: "Цветок", emoji: "🌸", weight: 1}, {en: "Star", ru: "Звезда", emoji: "⭐", weight: 1},
            {en: "Moon", ru: "Луна", emoji: "🌙", weight: 1}, {en: "Ball", ru: "Мяч", emoji: "⚽", weight: 1},
            {en: "Banana", ru: "Банан", emoji: "🍌", weight: 1}, {en: "Train", ru: "Поезд", emoji: "🚂", weight: 1},
            {en: "Bear", ru: "Медведь", emoji: "🐻", weight: 1}, {en: "Lion", ru: "Лев", emoji: "🦁", weight: 1}
        ];

        const hebrewWords = [
            {he: "כֶּלֶב", translation: "Собака", emoji: "🐕", weight: 1}, {he: "חָתוּל", translation: "Кошка", emoji: "🐈", weight: 1},
            {he: "בַּיִת", translation: "Дом", emoji: "🏠", weight: 1}, {he: "סֵפֶר", translation: "Книга", emoji: "📖", weight: 1},
            {he: "שֶׁמֶשׁ", translation: "Солнце", emoji: "☀️", weight: 1}, {he: "מַיִם", translation: "Вода", emoji: "💧", weight: 1},
            {he: "עֵץ", translation: "Дерево", emoji: "🌳", weight: 1}, {he: "תַּפּוּחַ", translation: "Яблоко", emoji: "🍎", weight: 1},
            {he: "יֶלֶד", translation: "Мальчик", emoji: "👦", weight: 1}, {he: "יַלְדָּה", translation: "Девочка", emoji: "👧", weight: 1}
        ];

        const russianWords = [
            { word: "Солнце", hint: "☀️", weight: 1 }, { word: "Кошка", hint: "🐈", weight: 1 },
            { word: "Машина", hint: "🚗", weight: 1 }, { word: "Яблоко", hint: "🍎", weight: 1 },
            { word: "Дерево", hint: "🌳", weight: 1 }, { word: "Книга", hint: "📖", weight: 1 },
            { word: "Молоко", hint: "🥛", weight: 1 }, { word: "Собака", hint: "🐕", weight: 1 }
        ];

        const englishSentences = [
            { text: "I have a cat", lang: "en-US", translation: "🐈" },
            { text: "The sun is red", lang: "en-US", translation: "☀️" },
            { text: "I like big apples", lang: "en-US", translation: "🍎" },
            { text: "The dog runs fast", lang: "en-US", translation: "🐕" }
        ];

        const russianSentences = [
            { text: "Кошка пьет молоко", lang: "ru-RU", translation: "🐈" },
            { text: "Машина едет быстро", lang: "ru-RU", translation: "🚗" },
            { text: "Книга лежит на столе", lang: "ru-RU", translation: "📖" },
            { text: "Собака громко лает", lang: "ru-RU", translation: "🐕" }
        ];

        const mathWordProblems = [
            { text: "У Маши было 3 яблока, она съела 1. Сколько осталось?", answer: 2, options: [1, 2, 3, 4] },
            { text: "На ветке сидело 4 птички, прилетело еще 2. Сколько всего птичек?", answer: 6, options: [5, 6, 7, 4] },
            { text: "В гараже стояло 5 машин, 2 уехали. Сколько осталось?", answer: 3, options: [2, 3, 4, 5] },
            { text: "У Саши было 4 конфеты, мама дала еще 3. Сколько стало конфет?", answer: 7, options: [6, 7, 8, 5] }
        ];

        const categoryData = {
            english: {
                title: "🇬🇧 Английский язык",
                exercises: [
                    { id: 'english_words', title: "Слова", desc: "Картинки и звук", icon: "🍎" },
                    { id: 'match_pairs', title: "Найди пару", desc: "Соедини слова со звуком", icon: "🧩" },
                    { id: 'build_sentence_en', title: "Фразы", desc: "Собери предложение", icon: "✍️" }
                ]
            },
            hebrew: {
                title: "🇮🇱 Иврит",
                exercises: [
                    { id: 'hebrew_words', title: "Слова", desc: "Чтение", icon: "📖" },
                    { id: 'hebrew_reading', title: "Тексты", desc: "Вопросы по чтению", icon: "🇮🇱" }
                ]
            },
            russian: {
                title: "🇷🇺 Русский язык",
                exercises: [
                    { id: 'russian_words', title: "Слова на слух", desc: "Аудирование", icon: "🔊" },
                    { id: 'build_sentence_ru', title: "Фразы", desc: "Собери предложение", icon: "📝" }
                ]
            },
            math: {
                title: "🔢 Математика",
                exercises: [
                    { id: 'math_table', title: "Умножение", desc: "Таблица", icon: "✖️" },
                    { id: 'math_plus_minus', title: "Счет", desc: "Плюс и минус", icon: "➕" },
                    { id: 'math_problems', title: "Задачи", desc: "Слушай и решай", icon: "🎧" },
                    { id: 'math_compare', title: "Сравнение", desc: "Больше или меньше", icon: "⚖️" }
                ]
            }
        };

        let currentCategory = null;
        let currentMode = null;
        let score = 0;
        let streak = 0;
        let totalCorrect = 0;
        let totalAttempts = 0;
        let sessionProgress = 0;
        let totalScoreAllTime = parseInt(localStorage.getItem('kids_total_score') || '0');
        let failedAttemptsCount = 0;

        const menuScreen = document.getElementById('menuScreen');
        const exercisesScreen = document.getElementById('exercisesScreen');
        const gameScreen = document.getElementById('gameScreen');
        const statsBar = document.getElementById('statsBar');
        const progressContainer = document.getElementById('progressContainer');
        const scoreVal = document.getElementById('scoreVal');
        const streakVal = document.getElementById('streakVal');
        const accuracyVal = document.getElementById('accuracyVal');
        const progressBarFill = document.getElementById('progressBarFill');
        const gameContent = document.getElementById('gameContent');
        const categoryTitle = document.getElementById('categoryTitle');
        const exerciseListContainer = document.getElementById('exerciseListContainer');

        updateRewardsDisplay();

        function openCategory(catKey) {
            currentCategory = catKey;
            const cat = categoryData[catKey];
            categoryTitle.textContent = cat.title;

            let html = '';
            cat.exercises.forEach(ex => {
                html += `
                    <div class="exercise-card" onclick="startGame('${ex.id}')">
                        <div class="ex-icon">${ex.icon}</div>
                        <div>
                            <h4>${ex.title}</h4>
                        </div>
                    </div>
                `;
            });
            exerciseListContainer.innerHTML = html;
            menuScreen.style.display = 'none';
            exercisesScreen.style.display = 'block';
        }

        function returnToMainCategoryMenu() {
            exercisesScreen.style.display = 'none';
            menuScreen.style.display = 'block';
            currentCategory = null;
        }

        function startGame(mode) {
            currentMode = mode;
            exercisesScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            statsBar.style.display = 'flex';
            progressContainer.style.display = 'block';
            score = 0;
            streak = 0;
            totalCorrect = 0;
            totalAttempts = 0;
            sessionProgress = 0;
            updateStats();
            updateProgressUI();
            nextQuestion();
        }

        function returnToExercises() {
            gameScreen.style.display = 'none';
            statsBar.style.display = 'none';
            progressContainer.style.display = 'none';
            exercisesScreen.style.display = 'block';
            currentMode = null;
            updateRewardsDisplay();
        }

        function updateStats() {
            scoreVal.textContent = score;
            streakVal.textContent = streak;
            const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 100;
            accuracyVal.textContent = accuracy + '%';
        }

        function updateProgressUI() {
            const percent = Math.min((sessionProgress / 10) * 100, 100);
            progressBarFill.style.width = percent + '%';
        }

        function checkRewards(points) {
            totalScoreAllTime += points;
            localStorage.setItem('kids_total_score', totalScoreAllTime);
            const badges = document.querySelectorAll('.reward-badge');
            badges.forEach(badge => {
                const targetScore = parseInt(badge.getAttribute('data-score'));
                if (totalScoreAllTime >= targetScore && !badge.classList.contains('unlocked')) {
                    badge.classList.add('unlocked');
                    showRewardPopup(`🏆 Награда разблокирована!`);
                }
            });
        }

        function updateRewardsDisplay() {
            const badges = document.querySelectorAll('.reward-badge');
            badges.forEach(badge => {
                const targetScore = parseInt(badge.getAttribute('data-score'));
                if (totalScoreAllTime >= targetScore) badge.classList.add('unlocked');
            });
        }

        function showRewardPopup(text) {
            const popup = document.getElementById('rewardPopup');
            document.getElementById('rewardText').textContent = text;
            popup.classList.add('show');
            setTimeout(() => popup.classList.remove('show'), 3000);
        }

        function getWeightedItem(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        function nextQuestion() {
            failedAttemptsCount = 0;
            if (currentMode === 'english_words') generateEnglishQuestion();
            else if (currentMode === 'hebrew_words') generateHebrewWordQuestion();
            else if (currentMode === 'hebrew_reading') generateHebrewReadingQuestion();
            else if (currentMode === 'russian_words') generateRussianWordQuestion();
            else if (currentMode === 'build_sentence_en') generateBuildSentenceQuestion(englishSentences);
            else if (currentMode === 'build_sentence_ru') generateBuildSentenceQuestion(russianSentences);
            else if (currentMode === 'match_pairs') generateMatchPairsQuestion();
            else if (currentMode === 'math_table') generateMathTableQuestion();
            else if (currentMode === 'math_plus_minus') generateMathPlusMinusQuestion();
            else if (currentMode === 'math_problems') generateMathProblemQuestion();
            else if (currentMode === 'math_compare') generateMathCompareQuestion();
        }

        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function generateEnglishQuestion() {
            const correctItem = getWeightedItem(englishWords);
            let wrongItems = englishWords.filter(item => item.en !== correctItem.en);
            wrongItems.sort(() => 0.5 - Math.random());
            let options = [correctItem, ...wrongItems.slice(0, 3)];
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <span>${correctItem.en}</span>
                        <button class="speak-btn" onclick="speakText('${correctItem.en}', 'en-US')">🔊</button>
                    </div>
                </div>
                <div class="options-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" onclick="handleCardAnswer(this, '${opt.en}', '${correctItem.en}')">
                        <div class="emoji-icon">${opt.emoji}</div>
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateHebrewWordQuestion() {
            const correctItem = getWeightedItem(hebrewWords);
            let wrongItems = hebrewWords.filter(item => item.he !== correctItem.he);
            wrongItems.sort(() => 0.5 - Math.random());
            let options = [correctItem, ...wrongItems.slice(0, 3)];
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <span style="direction: rtl; font-size: 2.5rem; color: #7e22ce;">${correctItem.he}</span>
                    </div>
                </div>
                <div class="options-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" onclick="handleCardAnswer(this, '${opt.he}', '${correctItem.he}')">
                        <div class="emoji-icon">${opt.emoji}</div>
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateHebrewReadingQuestion() {
            const item = {text: "הַיֶּלֶד דָּוִד שׁוֹתֶה חָלָב חַם בַּבֹּקֶר.", correct: "חָלָב חַם", options: ["חָלָב חַם", "מַיִם קָרִים", "מִיץ תַּפּוּחִים", "תֵּה מְתוֹק"]};
            let options = [...item.options].sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="reading-text">${item.text}</div>
                </div>
                <div class="reading-options">
            `;
            options.forEach(opt => {
                html += `
                    <div class="reading-option" onclick="handleCardAnswer(this, '${opt}', '${item.correct}')">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateRussianWordQuestion() {
            const correctItem = getWeightedItem(russianWords);
            let wrongItems = russianWords.filter(item => item.word !== correctItem.word);
            wrongItems.sort(() => 0.5 - Math.random());
            
            let options = [correctItem.word, wrongItems[0].word, wrongItems[1].word, wrongItems[2].word];
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <button class="speak-btn" onclick="speakText('${correctItem.word}', 'ru-RU')">🔊</button>
                    </div>
                </div>
                <div class="options-grid">
            `;
            options.forEach(opt => {
                let matchingEmoji = russianWords.find(w => w.word === opt)?.hint || "⭐";
                html += `
                    <div class="option-card" style="font-size: 1.4rem;" onclick="handleCardAnswer(this, '${opt}', '${correctItem.word}')">
                        <div class="emoji-icon">${matchingEmoji}</div>
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        let currentSentenceObj = null;
        let userConstructedWords = [];

        function generateBuildSentenceQuestion(bank) {
            currentSentenceObj = bank[Math.floor(Math.random() * bank.length)];
            userConstructedWords = [];
            setTimeout(() => speakText(currentSentenceObj.text, currentSentenceObj.lang), 300);

            const originalWords = currentSentenceObj.text.split(' ');
            let shuffledWords = [...originalWords].sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <button class="speak-btn" onclick="speakText('${currentSentenceObj.text}', '${currentSentenceObj.lang}')">🔊</button>
                        <span style="font-size: 2.5rem;">${currentSentenceObj.translation}</span>
                    </div>
                </div>
                <div class="sentence-drop-zone" id="dropZone" onclick="resetSentenceBuild()"></div>
                <div class="word-pool" id="wordPool">
            `;
            shuffledWords.forEach((word, index) => {
                html += `<div class="word-chip" id="chip-${index}" onclick="selectWordChip('${word}', 'chip-${index}')">${word}</div>`;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function selectWordChip(word, chipId) {
            userConstructedWords.push({ word, chipId });
            document.getElementById(chipId).classList.add('used');
            renderDropZone();

            const originalWords = currentSentenceObj.text.split(' ');
            if (userConstructedWords.length === originalWords.length) {
                totalAttempts++;
                const userString = userConstructedWords.map(item => item.word).join(' ');

                if (userString === currentSentenceObj.text) {
                    score += 15;
                    streak += 1;
                    totalCorrect++;
                    sessionProgress++;
                    checkRewards(15);
                    updateStats();
                    updateProgressUI();
                    document.getElementById('dropZone').style.borderColor = 'var(--success)';
                    document.getElementById('dropZone').style.background = '#d1fae5';
                    setTimeout(() => generateBuildSentenceQuestion(currentMode === 'build_sentence_en' ? englishSentences : russianSentences), 1200);
                } else {
                    failedAttemptsCount++;
                    if (failedAttemptsCount >= 2) {
                        streak = 0;
                        updateStats();
                        document.getElementById('dropZone').style.borderColor = 'var(--error)';
                        document.getElementById('dropZone').style.background = '#ffe4e6';
                        setTimeout(() => generateBuildSentenceQuestion(currentMode === 'build_sentence_en' ? englishSentences : russianSentences), 1200);
                    } else {
                        document.getElementById('dropZone').style.borderColor = 'var(--error)';
                        document.getElementById('dropZone').style.background = '#ffe4e6';
                        setTimeout(() => resetSentenceBuild(), 800);
                    }
                }
            }
        }

        function renderDropZone() {
            const dropZone = document.getElementById('dropZone');
            if (userConstructedWords.length === 0) {
                dropZone.innerHTML = ``;
                return;
            }
            let html = '';
            userConstructedWords.forEach(item => {
                html += `<div class="selected-word-chip">${item.word}</div>`;
            });
            dropZone.innerHTML = html;
        }

        function resetSentenceBuild() {
            userConstructedWords.forEach(item => {
                document.getElementById(item.chipId).classList.remove('used');
            });
            userConstructedWords = [];
            renderDropZone();
            document.getElementById('dropZone').style.borderColor = '#d8b4fe';
            document.getElementById('dropZone').style.background = '#faf5ff';
        }

        let selectedPairCard = null;
        let matchedPairsCount = 0;

        function generateMatchPairsQuestion() {
            selectedPairCard = null;
            matchedPairsCount = 0;
            let shuffled = [...englishWords].sort(() => 0.5 - Math.random());
            let currentPairs = shuffled.slice(0, 4);

            let cardsData = [];
            currentPairs.forEach(item => {
                cardsData.push({ text: item.en, type: 'en', pairId: item.en });
                cardsData.push({ text: item.ru, type: 'ru', pairId: item.en, emoji: item.emoji });
            });
            cardsData.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">🧩</div>
                </div>
                <div class="match-grid" id="matchGrid">
            `;
            cardsData.forEach((card) => {
                if (card.type === 'en') {
                    html += `
                        <div class="match-card" onclick="handleMatchClick(this, '${card.pairId}', '${card.type}')">
                            <span onclick="event.stopPropagation(); speakText('${card.text}', 'en-US')" style="color:#a855f7; cursor:pointer;">🔊</span> ${card.text}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="match-card" onclick="handleMatchClick(this, '${card.pairId}', '${card.type}')">
                            <span style="font-size:2.5rem;">${card.emoji}</span>
                        </div>
                    `;
                }
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function handleMatchClick(element, pairId, type) {
            if (element.classList.contains('matched') || element.classList.contains('selected')) return;

            if (!selectedPairCard) {
                selectedPairCard = { element, pairId, type };
                element.classList.add('selected');
            } else {
                totalAttempts++;
                if (selectedPairCard.type !== type && selectedPairCard.pairId === pairId) {
                    selectedPairCard.element.classList.remove('selected');
                    selectedPairCard.element.classList.add('matched');
                    element.classList.add('matched');
                    selectedPairCard = null;
                    matchedPairsCount++;
                    score += 5;
                    updateStats();

                    if (matchedPairsCount === 4) {
                        sessionProgress++;
                        updateProgressUI();
                        checkRewards(20);
                        setTimeout(() => generateMatchPairsQuestion(), 800);
                    }
                } else {
                    selectedPairCard.element.classList.add('incorrect');
                    element.classList.add('incorrect');
                    let prevSelected = selectedPairCard.element;
                    selectedPairCard = null;
                    streak = 0;
                    updateStats();
                    setTimeout(() => {
                        prevSelected.classList.remove('incorrect', 'selected');
                        element.classList.remove('incorrect');
                    }, 500);
                }
            }
        }

        function generateMathTableQuestion() {
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            const correctAnswer = a * b;
            const questionStr = `${a} × ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 8) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake > 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.8rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathPlusMinusQuestion() {
            const isPlus = Math.random() > 0.5;
            let a, b, correctAnswer;
            if (isPlus) {
                a = Math.floor(Math.random() * 70) + 10;
                b = Math.floor(Math.random() * (90 - a)) + 1;
                correctAnswer = a + b;
            } else {
                a = Math.floor(Math.random() * 70) + 20;
                b = Math.floor(Math.random() * (a - 5)) + 1;
                correctAnswer = a - b;
            }
            const questionStr = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 10) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake >= 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.8rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathProblemQuestion() {
            const prob = mathWordProblems[Math.floor(Math.random() * mathWordProblems.length)];
            setTimeout(() => speakText(prob.text, 'ru-RU'), 300);
            let options = [...prob.options].sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <button class="speak-btn" onclick="speakText('${prob.text}', 'ru-RU')">🔊</button>
                    </div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.8rem;" onclick="handleMathAnswer(this, ${opt}, ${prob.answer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathCompareQuestion() {
            const numA = Math.floor(Math.random() * 90) + 10;
            const numB = Math.floor(Math.random() * 90) + 10;
            let correctSign = '=';
            if (numA > numB) correctSign = '>';
            else if (numA < numB) correctSign = '<';

            let options = ['>', '<', '='];

            let html = `
                <div class="question-box">
                    <div class="question-title">${numA}  ?  ${numB}</div>
                </div>
                <div class="options-grid" style="grid-template-columns: repeat(3, 1fr);">
            `;
            options.forEach(sign => {
                html += `
                    <div class="option-card" style="font-size: 2.2rem;" onclick="handleMathAnswer(this, '${sign}', '${correctSign}')">
                        ${sign}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function handleCardAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (selected === correct) {
                element.classList.add('correct');
                score += 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1000);
            } else {
                failedAttemptsCount++;
                if (failedAttemptsCount >= 2) {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1200);
                } else {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    streak = 0;
                    updateStats();
                }
            }
        }

        function handleMathAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (String(selected).trim() === String(correct).trim()) {
                element.classList.add('correct');
                score += 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1000);
            } else {
                failedAttemptsCount++;
                if (failedAttemptsCount >= 2) {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightMathCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1200);
                } else {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    streak = 0;
                    updateStats();
                }
            }
        }

        function disableAllCards(parent) {
            for (let card of parent.children) {
                card.style.pointerEvents = 'none';
            }
        }

        function highlightCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.getAttribute('onclick')?.includes(correct) || card.textContent.trim() === String(correct)) {
                    card.classList.add('correct');
                }
            }
        }

        function highlightMathCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.textContent.trim() == String(correct)) {
                    card.classList.add('correct');
                }
            }
        }
    </script>
</body>
</html>
