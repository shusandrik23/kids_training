<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧁 Сладкая Учеба 🍬</title>
    <style>
        :root {
            --primary: #ec4899;
            --primary-hover: #db2777;
            --success: #10b981;
            --error: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #dbeafe 100%);
            --card-bg: #ffffff;
            --text-main: #701a75;
            --radius: 25px;
            --shadow: 0 8px 20px -3px rgba(236, 72, 153, 0.15), 0 4px 6px -4px rgba(236, 72, 153, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Segoe UI', cursive;
        }

        /* Печатный шрифт для английского языка */
        .en-font {
            font-family: Arial, Helvetica, sans-serif !important;
            letter-spacing: 0.5px;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 12px 30px 12px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            font-size: 2.2rem;
            color: #db2777;
            margin-bottom: 2px;
            text-shadow: 2px 2px 0px #fbcfe8;
        }

        header::after {
            content: '🗺️ 🧁 🍬';
            font-size: 1.3rem;
            display: block;
            margin-top: 2px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #fbcfe8;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #a21caf;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #fbcfe8;
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 14px;
            background: #fce7f3;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid #fecdd3;
        }

        .progress-bar-fill {
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #ec4899,
                #ec4899 10px,
                #f472b6 10px,
                #f472b6 20px
            );
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 7px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px 10px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #fbcfe8;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .category-card::before {
            content: '♥';
            position: absolute;
            top: 6px;
            right: 8px;
            color: #fecdd3;
            font-size: 1.1rem;
        }

        .category-card:nth-child(1) { background: #fff1f2; }
        .category-card:nth-child(2) { background: #f5f3ff; }
        .category-card:nth-child(3) { background: #fdf4ff; }
        .category-card:nth-child(4) { background: #fffbeb; }

        .category-card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: #f472b6;
        }

        .cat-visual {
            font-size: 2.3rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .exercises-screen {
            display: none;
        }

        .back-menu-btn {
            background: #ffffff;
            border: 3px solid #fbcfe8;
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            color: #c084fc;
            transition: all 0.2s;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            box-shadow: 0 4px 6px -1px rgba(236, 72, 153, 0.1);
        }

        .back-menu-btn:hover {
            background: #fbcfe8;
            color: #a21caf;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 3px solid #fbcfe8;
            transition: all 0.2s;
        }

        .exercise-card:hover {
            border-color: #f472b6;
            background: #fdf2f8;
            transform: translateX(4px);
        }

        .exercise-card .ex-icon {
            font-size: 2.2rem;
            background: #fce7f3;
            padding: 12px;
            border-radius: 18px;
            border: 2px solid #fecdd3;
        }

        .exercise-card h4 {
            font-size: 1.3rem;
            color: #a21caf;
            font-weight: 800;
        }

        /* КАРТА СО 100 ДОСТИЖЕНИЯМИ */
        .map-section {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #fbcfe8;
            border-radius: var(--radius);
            padding: 18px 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .map-section h3 {
            color: #a21caf;
            margin-bottom: 12px;
            font-size: 1.4rem;
        }

        .map-path {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            justify-items: center;
            max-height: 260px;
            overflow-y: auto;
            padding: 4px;
            border: 2px dashed #fbcfe8;
            border-radius: 16px;
            background: #fffdfd;
        }

        .map-node {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            opacity: 0.5;
            position: relative;
        }

        .map-node::before {
            content: '🔒';
            position: absolute;
            top: 1px;
            right: 1px;
            font-size: 0.5rem;
        }

        .map-node .node-score {
            position: absolute;
            bottom: -8px;
            font-size: 0.4rem;
            background: #fff;
            padding: 1px 2px;
            border-radius: 4px;
            color: #64748b;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            white-space: nowrap;
        }

        .map-node.active-node {
            opacity: 1;
            background: linear-gradient(135deg, #fef08a, #fde047);
            border: 2px solid #f59e0b;
            border-style: solid;
            transform: scale(1.04);
            box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3);
        }

        .map-node.active-node::before {
            content: '⭐';
        }

        .map-node.active-node .node-score {
            background: #fef08a;
            color: #b45309;
            border-color: #f59e0b;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 15px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px;
            border: 2px dashed #fbcfe8;
            border-radius: 16px;
            background: #fffdfd;
        }

        .reward-card-item {
            width: 100%;
            aspect-ratio: 1;
            background: #fce7f3;
            border: 2px dashed #f472b6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.3s;
            font-size: 1.1rem;
            position: relative;
        }

        .reward-card-item .reward-tooltip {
            position: absolute;
            bottom: -10px;
            font-size: 0.4rem;
            background: #fff;
            padding: 1px 2px;
            border-radius: 4px;
            color: #db2777;
            font-weight: 700;
            border: 1px solid #fbcfe8;
            white-space: nowrap;
        }

        .reward-card-item.unlocked {
            opacity: 1;
            filter: grayscale(0);
            background: linear-gradient(135deg, #fff1f2, #f3e8ff);
            border: 2px solid #c084fc;
            border-style: solid;
            box-shadow: 0 2px 6px rgba(192, 132, 252, 0.3);
        }

        .game-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 22px 15px;
            box-shadow: var(--shadow);
            display: none;
            position: relative;
            border: 4px solid #fbcfe8;
        }

        .game-container::after {
            content: '🍬';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
        }

        .question-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: #701a75;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 1px 1px 0px #fbcfe8;
        }

        .speak-btn {
            background: linear-gradient(135deg, #ec4899, #c084fc);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.6rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            box-shadow: 0 6px 10px -3px rgba(192, 132, 252, 0.4);
        }

        .speak-btn:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-card {
            background: #faf5ff;
            border: 3px solid #e9d5ff;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.5rem;
            font-weight: 800;
            color: #581c87;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
            box-shadow: 0 4px 8px -1px rgba(168, 85, 247, 0.1);
        }

        .option-card:hover {
            border-color: #c084fc;
            background: #f3e8ff;
            transform: scale(1.02) translateY(-2px);
        }

        .option-card.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46;
            animation: jelly 0.5s;
        }

        .option-card.incorrect {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b;
            animation: shake 0.5s;
        }

        @keyframes jelly {
            0%, 100% {transform: scale(1);}
            25% {transform: scale(0.95, 1.05);}
            50% {transform: scale(1.05, 0.95);}
            75% {transform: scale(0.98, 1.02);}
        }

        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            20%, 60% {transform: translateX(-6px);}
            40%, 80% {transform: translateX(6px);}
        }

        .sentence-drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 75px;
            background: #faf5ff;
            border: 3px dashed #c084fc;
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 20px;
            align-items: center;
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-height: 160px;
            overflow-y: auto;
            padding: 4px;
        }

        .word-chip {
            background: #ffffff;
            border: 3px solid #c084fc;
            color: #7e22ce;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 5px -1px rgba(192, 132, 252, 0.2);
        }

        .word-chip.used {
            opacity: 0.4;
            pointer-events: none;
            background: #f3e8ff;
            border-color: #e9d5ff;
        }

        .selected-word-chip {
            background: #c084fc;
            color: white;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: 800;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .match-card {
            background: #faf5ff;
            border: 3px solid #e9d5ff;
            border-radius: 18px;
            padding: 15px 8px;
            text-align: center;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: 800;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #581c87;
        }

        .match-card:hover {
            border-color: #c084fc;
            background: #f3e8ff;
        }

        .match-card.selected {
            border-color: #ec4899;
            background: #fce7f3;
        }

        .match-card.matched {
            opacity: 0.5;
            pointer-events: none;
            background: #d1fae5;
            border-color: #10b981;
        }

        .reward-popup {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: linear-gradient(135deg, #fef08a, #fde047);
            color: #a16207;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1.2rem;
            box-shadow: 0 12px 18px -4px rgba(251, 191, 36, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            border: 3px solid #f59e0b;
            text-align: center;
            max-width: 90%;
        }

        .reward-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="rewardPopup" class="reward-popup">
        <span id="rewardText">🗺️ Достижение разблокировано!</span>
    </div>

    <div class="container">
        <header>
            <h1>🧁 Сладкая Учеба 🍬</h1>
        </header>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">⭐ <span id="scoreVal">0</span></div>
            <div class="stat-item">🔥 <span id="streakVal">0</span></div>
            <div class="stat-item">🎯 <span id="accuracyVal">100%</span></div>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menuScreen">
            <div class="categories-grid">
                <div class="category-card" onclick="openCategory('english')">
                    <div class="cat-visual">🇬🇧 <span style="color:#db2777;" class="en-font">ABC</span></div>
                </div>
                <div class="category-card" onclick="openCategory('hebrew')">
                    <div class="cat-visual">🇮🇱 <span style="color:#7e22ce;" dir="rtl">אבג</span></div>
                </div>
                <div class="category-card" onclick="openCategory('russian')">
                    <div class="cat-visual">🇷🇺 <span style="color:#9333ea;">АБВ</span></div>
                </div>
                <div class="category-card" onclick="openCategory('math')">
                    <div class="cat-visual">🔢 <span style="color:#ca8a04;">123</span></div>
                </div>
            </div>

            <!-- КАРТА И НАГРАДЫ СО 100 ДОСТИЖЕНИЯМИ -->
            <div class="map-section">
                <h3>🗺️ Карта достижений (100 этапов)</h3>
                <div class="map-path" id="mapPath"></div>

                <h3 style="margin-top: 15px; font-size: 1.2rem;">🏆 Твои награды (100 шт.)</h3>
                <div class="rewards-grid" id="rewardsGrid"></div>
            </div>
        </div>

        <!-- ЭКРАН ВЫБОРА УПРАЖНЕНИЙ -->
        <div id="exercisesScreen" class="exercises-screen">
            <button class="back-menu-btn" onclick="returnToMainCategoryMenu()">← Назад</button>
            <h2 id="categoryTitle" style="color: #a21caf; margin-bottom: 15px; font-size: 1.5rem; font-weight: 900;"></h2>
            <div class="exercise-list" id="exerciseListContainer"></div>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="gameScreen" class="game-container">
            <button class="back-menu-btn" onclick="returnToExercises()">← К списку</button>
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        const baseEnglishWords = [
            {en: "Cat", ru: "Кошка", emoji: "🐈"}, {en: "Dog", ru: "Собака", emoji: "🐕"},
            {en: "Apple", ru: "Яблоко", emoji: "🍎"}, {en: "House", ru: "Дом", emoji: "🏠"},
            {en: "Sun", ru: "Солнце", emoji: "☀️"}, {en: "Car", ru: "Машина", emoji: "🚗"},
            {en: "Book", ru: "Книга", emoji: "📖"}, {en: "Tree", ru: "Дерево", emoji: "🌳"},
            {en: "Water", ru: "Вода", emoji: "💧"}, {en: "Milk", ru: "Молоко", emoji: "🥛"},
            {en: "Fish", ru: "Рыба", emoji: "🐟"}, {en: "Bird", ru: "Птица", emoji: "🐦"},
            {en: "Flower", ru: "Цветок", emoji: "🌸"}, {en: "Star", ru: "Звезда", emoji: "⭐"},
            {en: "Moon", ru: "Луна", emoji: "🌙"}, {en: "Ball", ru: "Мяч", emoji: "⚽"},
            {en: "Banana", ru: "Банан", emoji: "🍌"}, {en: "Train", ru: "Поезд", emoji: "🚂"},
            {en: "Bear", ru: "Медведь", emoji: "🐻"}, {en: "Lion", ru: "Лев", emoji: "🦁"},
            {en: "Run", ru: "Бежать", emoji: "🏃"}, {en: "Jump", ru: "Прыгать", emoji: "🦘"},
            {en: "Read", ru: "Читать", emoji: "📖"}, {en: "Eat", ru: "Есть", emoji: "🍎"},
            {en: "Drink", ru: "Пить", emoji: "🧃"}, {en: "Sleep", ru: "Спать", emoji: "💤"},
            {en: "Play", ru: "Играть", emoji: "⚽"}, {en: "Fly", ru: "Летать", emoji: "🦅"},
            {en: "Swim", ru: "Плавать", emoji: "🏊"}, {en: "Sing", ru: "Петь", emoji: "🎤"},
            {en: "Big", ru: "Большой", emoji: "🐘"}, {en: "Small", ru: "Маленький", emoji: "🐜"},
            {en: "Happy", ru: "Счастливый", emoji: "🥳"}, {en: "Sad", ru: "Грустный", emoji: "😢"},
            {en: "Red", ru: "Красный", emoji: "🔴"}, {en: "Blue", ru: "Синий", emoji: "🔵"},
            {en: "Green", ru: "Зеленый", emoji: "🟢"}, {en: "Yellow", ru: "Желтый", emoji: "🟡"},
            {en: "Fast", ru: "Быстрый", emoji: "⚡"}, {en: "Slow", ru: "Медленный", emoji: "🐢"},
            {en: "One", ru: "Один", emoji: "1️⃣"}, {en: "Two", ru: "Два", emoji: "2️⃣"},
            {en: "Three", ru: "Три", emoji: "3️⃣"}, {en: "Four", ru: "Четыре", emoji: "4️⃣"},
            {en: "Five", ru: "Пять", emoji: "5️⃣"}, {en: "Six", ru: "Шесть", emoji: "6️⃣"},
            {en: "Seven", ru: "Семь", emoji: "7️⃣"}, {en: "Eight", ru: "Восемь", emoji: "8️⃣"},
            {en: "Nine", ru: "Девять", emoji: "9️⃣"}, {en: "Ten", ru: "Десять", emoji: "🔟"}
        ];

        let englishWords = [...baseEnglishWords];
        const extraTopics = [
            {en: "Tiger", ru: "Тигр", emoji: "🐅"}, {en: "Monkey", ru: "Обезьяна", emoji: "🐒"},
            {en: "Rabbit", ru: "Кролик", emoji: "🐇"}, {en: "Fox", ru: "Лиса", emoji: "🦊"},
            {en: "Wolf", ru: "Волк", emoji: "🐺"}, {en: "Cow", ru: "Корова", emoji: "🐄"},
            {en: "Pig", ru: "Свинья", emoji: "🐖"}, {en: "Horse", ru: "Лошадь", emoji: "🐎"},
            {en: "Sheep", ru: "Овца", emoji: "🐑"}, {en: "Duck", ru: "Утка", emoji: "🦆"},

        function handleMatchClick(element, pairId, type) {
            if (element.classList.contains('matched') || element.classList.contains('selected')) return;

            if (!selectedPairCard) {
                selectedPairCard = { element, pairId, type };
                element.classList.add('selected');
            } else {
                totalAttempts++;
                if (selectedPairCard.type !== type && selectedPairCard.pairId === pairId) {
                    selectedPairCard.element.classList.remove('selected');
                    selectedPairCard.element.classList.add('matched');
                    element.classList.add('matched');
                    selectedPairCard = null;
                    matchedPairsCount++;
                    score += 5;
                    updateStats();

                    if (matchedPairsCount === 4) {
                        sessionProgress++;
                        updateProgressUI();
                        checkRewards(20);
                        setTimeout(() => generateMatchPairsQuestion(), 800);
                    }
                } else {
                    selectedPairCard.element.classList.add('incorrect');
                    element.classList.add('incorrect');
                    let prevSelected = selectedPairCard.element;
                    selectedPairCard = null;
                    streak = 0;
                    updateStats();
                    setTimeout(() => {
                        prevSelected.classList.remove('incorrect', 'selected');
                        element.classList.remove('incorrect');
                    }, 500);
                }
            }
        }

        function generateMathTableQuestion() {
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            const correctAnswer = a * b;
            const questionStr = `${a} × ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 8) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake > 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.8rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathPlusMinusQuestion() {
            const isPlus = Math.random() > 0.5;
            let a, b, correctAnswer;
            if (isPlus) {
                a = Math.floor(Math.random() * 70) + 10;
                b = Math.floor(Math.random() * (90 - a)) + 1;
                correctAnswer = a + b;
            } else {
                a = Math.floor(Math.random() * 70) + 20;
                b = Math.floor(Math.random() * (a - 5)) + 1;
                correctAnswer = a - b;
            }
            const questionStr = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 10) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake >= 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.8rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathProblemQuestion() {
            const prob = getUniqueItem('math_problems', mathWordProblems);
            setTimeout(() => speakText(prob.text, 'ru-RU'), 300);
            let options = [...prob.options].sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <button class="speak-btn" onclick="speakText('${prob.text}', 'ru-RU')">🔊</button>
                    </div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.8rem;" onclick="handleMathAnswer(this, ${opt}, ${prob.answer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathCompareQuestion() {
            const numA = Math.floor(Math.random() * 90) + 10;
            const numB = Math.floor(Math.random() * 90) + 10;
            let correctSign = '=';
            if (numA > numB) correctSign = '>';
            else if (numA < numB) correctSign = '<';

            let options = ['>', '<', '='];

            let html = `
                <div class="question-box">
                    <div class="question-title">${numA}  ?  ${numB}</div>
                </div>
                <div class="options-grid" style="grid-template-columns: repeat(3, 1fr);">
            `;
            options.forEach(sign => {
                html += `
                    <div class="option-card" style="font-size: 2.2rem;" onclick="handleMathAnswer(this, '${sign}', '${correctSign}')">
                        ${sign}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function handleCardAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (selected === correct) {
                element.classList.add('correct');
                score += 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1200);
            } else {
                failedAttemptsCount++;
                if (failedAttemptsCount >= 2) {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1500);
                } else {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    streak = 0;
                    updateStats();
                }
            }
        }

        function handleMathAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (String(selected).trim() === String(correct).trim()) {
                element.classList.add('correct');
                score += 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1200);
            } else {
                failedAttemptsCount++;
                if (failedAttemptsCount >= 2) {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightMathCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1500);
                } else {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    streak = 0;
                    updateStats();
                }
            }
        }

        function disableAllCards(parent) {
            for (let card of parent.children) {
                card.style.pointerEvents = 'none';
            }
        }

        function highlightCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.getAttribute('onclick')?.includes(correct) || card.textContent.trim().includes(String(correct))) {
                    card.classList.add('correct');
                }
            }
        }

        function highlightMathCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.textContent.trim() == String(correct)) {
                    card.classList.add('correct');
                }
            }
        }
    </script>
</body>
</html>
