<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧁 Сладкая Учеба 🍬</title>
    <style>
        :root {
            --primary: #ec4899;
            --primary-hover: #db2777;
            --success: #10b981;
            --error: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #dbeafe 100%);
            --card-bg: #ffffff;
            --text-main: #701a75;
            --radius: 30px;
            --shadow: 0 10px 15px -3px rgba(236, 72, 153, 0.1), 0 4px 6px -4px rgba(236, 72, 153, 0.1);
            --shadow-hover: 0 20px 25px -5px rgba(236, 72, 153, 0.2), 0 10px 10px -5px rgba(236, 72, 153, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Segoe UI', cursive;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 20px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #db2777;
            margin-bottom: 4px;
            text-shadow: 2px 2px 0px #fbcfe8;
        }

        header::after {
            content: '🗺️ 🧁 🍬';
            font-size: 1.5rem;
            display: block;
            margin-top: 5px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #fbcfe8;
            padding: 12px 25px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #a21caf;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #fbcfe8;
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 18px;
            background: #fce7f3;
            border-radius: 9px;
            overflow: hidden;
            border: 1px solid #fecdd3;
        }

        .progress-bar-fill {
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #ec4899,
                #ec4899 10px,
                #f472b6 10px,
                #f472b6 20px
            );
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 9px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 30px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #fbcfe8;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .category-card::before {
            content: '♥';
            position: absolute;
            top: 10px;
            right: 10px;
            color: #fecdd3;
            font-size: 1.5rem;
        }

        .category-card:nth-child(1) { background: #fff1f2; }
        .category-card:nth-child(2) { background: #f5f3ff; }
        .category-card:nth-child(3) { background: #fdf4ff; }
        .category-card:nth-child(4) { background: #fffbeb; }

        .category-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: var(--shadow-hover);
            border-color: #f472b6;
        }

        .cat-visual {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercises-screen {
            display: none;
        }

        .back-menu-btn {
            background: #ffffff;
            border: 3px solid #fbcfe8;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 700;
            color: #c084fc;
            transition: all 0.2s;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px -1px rgba(236, 72, 153, 0.1);
        }

        .back-menu-btn:hover {
            background: #fbcfe8;
            color: #a21caf;
            transform: translateX(-3px);
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 3px solid #fbcfe8;
            transition: all 0.2s;
        }

        .exercise-card:hover {
            border-color: #f472b6;
            background: #fdf2f8;
            transform: translateX(8px);
        }

        .exercise-card .ex-icon {
            font-size: 2.5rem;
            background: #fce7f3;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #fecdd3;
        }

        .exercise-card h4 {
            font-size: 1.4rem;
            color: #a21caf;
            font-weight: 800;
        }

        .map-section {
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #fbcfe8;
            border-radius: var(--radius);
            padding: 25px;
            margin-top: 30px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .map-section h3 {
            color: #a21caf;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .map-path {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 10px 0;
            justify-items: center;
        }

        .map-node {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            background: #f1f5f9;
            border: 3px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            opacity: 0.5;
            position: relative;
            transition: all 0.4s;
        }

        .map-node::before {
            content: '🔒';
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 0.9rem;
        }

        .map-node .node-score {
            position: absolute;
            bottom: -16px;
            font-size: 0.65rem;
            background: #fff;
            padding: 1px 5px;
            border-radius: 8px;
            color: #64748b;
            font-weight: 700;
            border: 1px solid #cbd5e1;
        }

        .map-node.active-node {
            opacity: 1;
            background: linear-gradient(135deg, #fef08a, #fde047);
            border: 3px solid #f59e0b;
            border-style: solid;
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.4);
        }

        .map-node.active-node::before {
            content: '⭐';
        }

        .map-node.active-node .node-score {
            background: #fef08a;
            color: #b45309;
            border-color: #f59e0b;
        }

        .rewards-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-top: 25px;
        }

        .reward-card-item {
            aspect-ratio: 1;
            background: #fce7f3;
            border: 2px dashed #f472b6;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.3s;
            font-size: 1.8rem;
        }

        .reward-card-item.unlocked {
            opacity: 1;
            filter: grayscale(0);
            background: linear-gradient(135deg, #fff1f2, #f3e8ff);
            border: 2px solid #c084fc;
            border-style: solid;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(192, 132, 252, 0.3);
        }

        .game-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 35px;
            box-shadow: var(--shadow);
            display: none;
            position: relative;
            border: 4px solid #fbcfe8;
        }

        .game-container::after {
            content: '🍬';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
        }

        .question-box {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #701a75;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-shadow: 1px 1px 0px #fbcfe8;
        }

        .speak-btn {
            background: linear-gradient(135deg, #ec4899, #c084fc);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            box-shadow: 0 10px 15px -3px rgba(192, 132, 252, 0.4);
        }

        .speak-btn:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .option-card {
            background: #faf5ff;
            border: 4px solid #e9d5ff;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 2.5rem;
            font-weight: 800;
            color: #581c87;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 140px;
            box-shadow: 0 6px 10px -1px rgba(168, 85, 247, 0.1);
        }

        .option-card:hover {
            border-color: #c084fc;
            background: #f3e8ff;
            transform: scale(1.03) translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(168, 85, 247, 0.2);
        }

        .option-card.correct {
            background: #d1fae5 !important;
            border-color: #10b981 !important;
            color: #065f46;
            animation: jelly 0.5s;
        }

        .option-card.incorrect {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b;
            animation: shake 0.5s;
        }

        @keyframes jelly {
            0%, 100% {transform: scale(1);}
            25% {transform: scale(0.95, 1.05);}
            50% {transform: scale(1.05, 0.95);}
            75% {transform: scale(0.98, 1.02);}
        }

        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            20%, 60% {transform: translateX(-10px);}
            40%, 80% {transform: translateX(10px);}
        }

        .sentence-drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            min-height: 90px;
            background: #faf5ff;
            border: 4px dashed #c084fc;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 30px;
            align-items: center;
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .word-chip {
            background: #ffffff;
            border: 4px solid #c084fc;
            color: #7e22ce;
            padding: 15px 25px;
            border-radius: 20px;
            font-size: 1.6rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(192, 132, 252, 0.2);
        }

        .word-chip.used {
            opacity: 0.4;
            pointer-events: none;
            background: #f3e8ff;
            border-color: #e9d5ff;
        }

        .selected-word-chip {
            background: #c084fc;
            color: white;
            padding: 14px 24px;
            border-radius: 20px;
            font-size: 1.6rem;
            font-weight: 800;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .match-card {
            background: #faf5ff;
            border: 4px solid #e9d5ff;
            border-radius: 25px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            font-size: 2rem;
            font-weight: 800;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #581c87;
        }

        .match-card:hover {
            border-color: #c084fc;
            background: #f3e8ff;
            transform: scale(1.03);
        }

        .match-card.selected {
            border-color: #ec4899;
            background: #fce7f3;
        }

        .match-card.matched {
            opacity: 0.5;
            pointer-events: none;
            background: #d1fae5;
            border-color: #10b981;
        }

        .reward-popup {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            background: linear-gradient(135deg, #fef08a, #fde047);
            color: #a16207;
            padding: 20px 40px;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(251, 191, 36, 0.4);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            border: 4px solid #f59e0b;
            text-align: center;
        }

        .reward-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="rewardPopup" class="reward-popup">
        <span id="rewardText">🗺️ Новый этап на карте пройден!</span>
    </div>

    <div class="container">
        <header>
            <h1>🧁 Сладкая Учеба 🍬</h1>
        </header>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">⭐ <span id="scoreVal">0</span></div>
            <div class="stat-item">🔥 <span id="streakVal">0</span></div>
            <div class="stat-item">🎯 <span id="accuracyVal">100%</span></div>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ С ПОНЯТНЫМИ ИКОНКАМИ -->
        <div id="menuScreen">
            <div class="categories-grid">
                <div class="category-card" onclick="openCategory('english')">
                    <div class="cat-visual">🇬🇧 <span style="color:#db2777;">ABC</span></div>
                </div>
                <div class="category-card" onclick="openCategory('hebrew')">
                    <div class="cat-visual">🇮🇱 <span style="color:#7e22ce;" dir="rtl">אבג</span></div>
                </div>
                <div class="category-card" onclick="openCategory('russian')">
                    <div class="cat-visual">🇷🇺 <span style="color:#9333ea;">АБВ</span></div>
                </div>
                <div class="category-card" onclick="openCategory('math')">
                    <div class="cat-visual">🔢 <span style="color:#ca8a04;">123</span></div>
                </div>
            </div>

            <!-- КРУПНАЯ КАРТА И КОЛЛЕКЦИЯ БЕЗ БЕГУНКА -->
            <div class="map-section">
                <h3>🗺️ Карта путешествия</h3>
                <div class="map-path" id="mapPath">
                    <div class="map-node" data-score="20">🐱<span class="node-score">20⭐</span></div>
                    <div class="map-node" data-score="40">🐰<span class="node-score">40⭐</span></div>
                    <div class="map-node" data-score="70">🐼<span class="node-score">70⭐</span></div>
                    <div class="map-node" data-score="100">🧸<span class="node-score">100⭐</span></div>
                    <div class="map-node" data-score="150">🦊<span class="node-score">150⭐</span></div>
                    <div class="map-node" data-score="200">🦉<span class="node-score">200⭐</span></div>
                    <div class="map-node" data-score="300">🧚‍♀️<span class="node-score">300⭐</span></div>
                    <div class="map-node" data-score="450">🧜‍♀️<span class="node-score">450⭐</span></div>
                    <div class="map-node" data-score="600">🐲<span class="node-score">600⭐</span></div>
                    <div class="map-node" data-score="800">🦄<span class="node-score">800⭐</span></div>
                    <div class="map-node" data-score="1000">🌟<span class="node-score">1000⭐</span></div>
                    <div class="map-node" data-score="1250">👑<span class="node-score">1250⭐</span></div>
                </div>

                <h3 style="margin-top: 25px; font-size: 1.4rem;">🃏 Твои карточки</h3>
                <div class="rewards-grid" id="rewardsGrid">
                    <div class="reward-card-item" data-score="20" data-name="Милый Кот">🐱</div>
                    <div class="reward-card-item" data-score="40" data-name="Зайка">🐰</div>
                    <div class="reward-card-item" data-score="70" data-name="Панда">🐼</div>
                    <div class="reward-card-item" data-score="100" data-name="Мишка">🧸</div>
                    <div class="reward-card-item" data-score="150" data-name="Лисичка">🦊</div>
                    <div class="reward-card-item" data-score="200" data-name="Совёнок">🦉</div>
                    <div class="reward-card-item" data-score="300" data-name="Фея">🧚‍♀️</div>
                    <div class="reward-card-item" data-score="450" data-name="Русалочка">🧜‍♀️</div>
                    <div class="reward-card-item" data-score="600" data-name="Дракоша">🐲</div>
                    <div class="reward-card-item" data-score="800" data-name="Единорог">🦄</div>
                    <div class="reward-card-item" data-score="1000" data-name="Звёздочка">🌟</div>
                    <div class="reward-card-item" data-score="1250" data-name="Принцесса">👑</div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН ВЫБОРА УПРАЖНЕНИЙ -->
        <div id="exercisesScreen" class="exercises-screen">
            <button class="back-menu-btn" onclick="returnToMainCategoryMenu()">← Назад</button>
            <h2 id="categoryTitle" style="color: #a21caf; margin-bottom: 20px; font-size: 1.8rem; font-weight: 900;"></h2>
            <div class="exercise-list" id="exerciseListContainer"></div>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="gameScreen" class="game-container">
            <button class="back-menu-btn" onclick="returnToExercises()">← К списку</button>
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        const englishWords = [
            {en: "Cat", ru: "Кошка", emoji: "🐈"}, {en: "Dog", ru: "Собака", emoji: "🐕"},
            {en: "Apple", ru: "Яблоко", emoji: "🍎"}, {en: "House", ru: "Дом", emoji: "🏠"},
            {en: "Sun", ru: "Солнце", emoji: "☀️"}, {en: "Car", ru: "Машина", emoji: "🚗"},
            {en: "Book", ru: "Книга", emoji: "📖"}, {en: "Tree", ru: "Дерево", emoji: "🌳"},
            {en: "Water", ru: "Вода", emoji: "💧"}, {en: "Milk", ru: "Молоко", emoji: "🥛"},
            {en: "Fish", ru: "Рыба", emoji: "🐟"}, {en: "Bird", ru: "Птица", emoji: "🐦"},
            {en: "Flower", ru: "Цветок", emoji: "🌸"}, {en: "Star", ru: "Звезда", emoji: "⭐"},
            {en: "Moon", ru: "Луна", emoji: "🌙"}, {en: "Ball", ru: "Мяч", emoji: "⚽"},
            {en: "Banana", ru: "Банан", emoji: "🍌"}, {en: "Train", ru: "Поезд", emoji: "🚂"},
            {en: "Bear", ru: "Медведь", emoji: "🐻"}, {en: "Lion", ru: "Лев", emoji: "🦁"}
        ];

        const hebrewWords = [
            {he: "כֶּלֶב", translation: "Собака", emoji: "🐕"}, {he: "חָתוּל", translation: "Кошка", emoji: "🐈"},
            {he: "בַּיִת", translation: "Дом", emoji: "🏠"}, {he: "סֵפֶר", translation: "Книга", emoji: "📖"},
            {he: "שֶׁמֶשׁ", translation: "Солнце", emoji: "☀️"}, {he: "מַיִם", translation: "Вода", emoji: "💧"},
            {he: "עֵץ", translation: "Дерево", emoji: "🌳"}, {he: "תַּפּוּחַ", translation: "Яблоко", emoji: "🍎"},
            {he: "יֶלֶד", translation: "Мальчик", emoji: "👦"}, {he: "יַלְדָּה", translation: "Девочка", emoji: "👧"}
        ];

        const russianWords = [
            "Солнце", "Кошка", "Машина", "Яблоко", "Дерево", "Книга", "Молоко", "Цветок",

            cardItems.forEach(item => {
                const targetScore = parseInt(item.getAttribute('data-score'));
                const cardName = item.getAttribute('data-name');
                if (totalScoreAllTime >= targetScore && !item.classList.contains('unlocked')) {
                    item.classList.add('unlocked');
                    showRewardPopup(`🗺️ Шаг пройден! Открылась карточка!`);
                }
            });
            updateRewardsDisplay();
        }

        function updateRewardsDisplay() {
            const mapNodes = document.querySelectorAll('.map-node');
            mapNodes.forEach(node => {
                const targetScore = parseInt(node.getAttribute('data-score'));
                if (totalScoreAllTime >= targetScore) {
                    node.classList.add('active-node');
                }
            });

            const cardItems = document.querySelectorAll('.reward-card-item');
            cardItems.forEach(item => {
                const targetScore = parseInt(item.getAttribute('data-score'));
                if (totalScoreAllTime >= targetScore) {
                    item.classList.add('unlocked');
                }
            });
        }

        function generateBuildSentenceQuestion(bank, modeKey) {
            currentSentenceObj = getUniqueItem(modeKey, bank);
            userConstructedWords = [];
            setTimeout(() => speakText(currentSentenceObj.text, currentSentenceObj.lang), 300);

            const originalWords = currentSentenceObj.text.split(' ');
            let shuffledWords = [...originalWords].sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <button class="speak-btn" onclick="speakText('${currentSentenceObj.text}', '${currentSentenceObj.lang}')">🔊</button>

                html += `<div class="word-chip" id="chip-${index}" onclick="selectWordChip('${word}', 'chip-${index}', '${modeKey}')">${word}</div>`;
            });

        function selectWordChip(word, chipId, modeKey) {
            userConstructedWords.push({ word, chipId });
            document.getElementById(chipId).classList.add('used');
            renderDropZone();

            const originalWords = currentSentenceObj.text.split(' ');
            if (userConstructedWords.length === originalWords.length) {
                totalAttempts++;
                const userString = userConstructedWords.map(item => item.word).join(' ');

                if (userString === currentSentenceObj.text) {
                    score += 15;
                    streak += 1;
                    totalCorrect++;
                    sessionProgress++;
                    checkRewards(15);
                    updateStats();
                    updateProgressUI();
                    document.getElementById('dropZone').style.borderColor = 'var(--success)';
                    document.getElementById('dropZone').style.background = '#d1fae5';
                    setTimeout(() => generateBuildSentenceQuestion(currentMode === 'build_sentence_en' ? englishSentences : russianSentences, modeKey), 1200);
                } else {
                    failedAttemptsCount++;
                    if (failedAttemptsCount >= 2) {
                        streak = 0;
                        updateStats();
                        document.getElementById('dropZone').style.borderColor = 'var(--error)';
                        document.getElementById('dropZone').style.background = '#fee2e2';
                        setTimeout(() => generateBuildSentenceQuestion(currentMode === 'build_sentence_en' ? englishSentences : russianSentences, modeKey), 1200);
                    } else {
                        document.getElementById('dropZone').style.borderColor = 'var(--error)';
                        document.getElementById('dropZone').style.background = '#fee2e2';

                html += `<div class="selected-word-chip">${item.word}</div>`;

        function generateMatchPairsQuestion() {
            selectedPairCard = null;
            matchedPairsCount = 0;
            let shuffled = [...englishWords].sort(() => 0.5 - Math.random());
            let currentPairs = shuffled.slice(0, 4);

            let cardsData = [];
            currentPairs.forEach(item => {
                cardsData.push({ text: item.en, type: 'en', pairId: item.en });
                cardsData.push({ text: item.ru, type: 'ru', pairId: item.en, emoji: item.emoji });
            });
            cardsData.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">🧩</div>
                </div>
                <div class="match-grid" id="matchGrid">
            `;
            cardsData.forEach((card) => {
                if (card.type === 'en') {
                    html += `
                        <div class="match-card" onclick="handleMatchClick(this, '${card.pairId}', '${card.type}')">
                            <span onclick="event.stopPropagation(); speakText('${card.text}', 'en-US')" style="color:#c084fc; cursor:pointer;">🔊</span> ${card.text}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="match-card" onclick="handleMatchClick(this, '${card.pairId}', '${card.type}')">
                            <span style="font-size:3rem;">${card.emoji}</span>
                        </div>
                    `;
                }
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function handleMatchClick(element, pairId, type) {
            if (element.classList.contains('matched') || element.classList.contains('selected')) return;

            if (!selectedPairCard) {
                selectedPairCard = { element, pairId, type };
                element.classList.add('selected');
            } else {
                totalAttempts++;
                if (selectedPairCard.type !== type && selectedPairCard.pairId === pairId) {
                    selectedPairCard.element.classList.remove('selected');
                    selectedPairCard.element.classList.add('matched');
                    element.classList.add('matched');
                    selectedPairCard = null;
                    matchedPairsCount++;
                    score += 5;
                    updateStats();

                    if (matchedPairsCount === 4) {
                        sessionProgress++;
                        updateProgressUI();
                        checkRewards(20);
                        setTimeout(() => generateMatchPairsQuestion(), 800);
                    }
                } else {
                    selectedPairCard.element.classList.add('incorrect');
                    element.classList.add('incorrect');
                    let prevSelected = selectedPairCard.element;
                    selectedPairCard = null;
                    streak = 0;
                    updateStats();
                    setTimeout(() => {
                        prevSelected.classList.remove('incorrect', 'selected');
                        element.classList.remove('incorrect');
                    }, 500);
                }
            }
        }

        function generateMathTableQuestion() {
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            const correctAnswer = a * b;
            const questionStr = `${a} × ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 8) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake > 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 2.5rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathPlusMinusQuestion() {
            const isPlus = Math.random() > 0.5;
            let a, b, correctAnswer;
            if (isPlus) {
                a = Math.floor(Math.random() * 70) + 10;
                b = Math.floor(Math.random() * (90 - a)) + 1;
                correctAnswer = a + b;
            } else {
                a = Math.floor(Math.random() * 70) + 20;
                b = Math.floor(Math.random() * (a - 5)) + 1;
                correctAnswer = a - b;
            }
            const questionStr = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 10) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake >= 0 && !options.includes(fake)) options.push(fake);
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                </div>
                <div class="options-grid math-grid">
            `;
            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 2.5rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

                        ${opt}
                    </div>

            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathCompareQuestion() {
            const numA = Math.floor(Math.random() * 90) + 10;
            const numB = Math.floor(Math.random() * 90) + 10;
            let correctSign = '=';
            if (numA > numB) correctSign = '>';
            else if (numA < numB) correctSign = '<';

            let options = ['>', '<', '='];

            let html = `
                <div class="question-box">
                    <div class="question-title">${numA}  ?  ${numB}</div>
                </div>
                <div class="options-grid" style="grid-template-columns: repeat(3, 1fr);">
            `;
            options.forEach(sign => {
                html += `
                    <div class="option-card" style="font-size: 3rem;" onclick="handleMathAnswer(this, '${sign}', '${correctSign}')">
                        ${sign}
                    </div>
                `;
            });
            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function handleCardAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (selected === correct) {
                element.classList.add('correct');
                score += 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1200);
            } else {
                failedAttemptsCount++;
                if (failedAttemptsCount >= 2) {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1500);
                } else {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    streak = 0;
                    updateStats();
                }
            }
        }

        function handleMathAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (String(selected).trim() === String(correct).trim()) {
                element.classList.add('correct');
                score += 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1200);
            } else {
                failedAttemptsCount++;
                if (failedAttemptsCount >= 2) {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightMathCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1500);
                } else {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    streak = 0;
                    updateStats();
                }
            }
        }

        function disableAllCards(parent) {
            for (let card of parent.children) {
                card.style.pointerEvents = 'none';
            }
        }

        function highlightCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.getAttribute('onclick')?.includes(correct) || card.textContent.trim() === String(correct)) {
                    card.classList.add('correct');
                }
            }
        }

        function highlightMathCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.textContent.trim() == String(correct)) {
                    card.classList.add('correct');
                }
            }
        }
    </script>
</body>
</html>
