<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные тренировки для детей</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --bg-gradient: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --radius: 16px;
            --shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.06), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-container {
            background: var(--card-bg);
            padding: 10px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* 4 Главные категории на первом экране */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px 20px;
            text-align: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .category-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            background: #faf5ff;
        }

        .category-card .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .category-card h3 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        /* Экран выбора упражнений внутри категории */
        .exercises-screen {
            display: none;
        }

        .back-menu-btn {
            background: #f3f4f6;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: background 0.2s;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .back-menu-btn:hover {
            background: #e5e7eb;
            color: var(--text-main);
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exercise-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .exercise-card:hover {
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .exercise-card .ex-icon {
            font-size: 2rem;
        }

        .exercise-card h4 {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .exercise-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .rewards-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 15px 20px;
            margin-top: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .rewards-section h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .rewards-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .reward-badge {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0.3;
            filter: grayscale(1);
            transition: all 0.3s;
        }

        .reward-badge.unlocked {
            opacity: 1;
            filter: grayscale(0);
            background: #ede9fe;
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        .game-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: none;
            position: relative;
        }

        .question-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .speak-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .speak-btn:hover {
            transform: scale(1.1);
            background: var(--primary-hover);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .option-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 75px;
        }

        .option-card .emoji-icon {
            font-size: 2.2rem;
            margin-bottom: 4px;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: #f5f3ff;
            transform: scale(1.01);
        }

        .option-card.correct {
            background: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
        }

        .option-card.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b;
        }

        .sentence-drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 55px;
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            align-items: center;
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .word-chip {
            background: #ffffff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }

        .word-chip:hover {
            background: #e0e7ff;
            transform: translateY(-2px);
        }

        .word-chip.used {
            opacity: 0.3;
            pointer-events: none;
            background: #e2e8f0;
            border-color: #cbd5e1;
            color: #94a3b8;
        }

        .selected-word-chip {
            background: var(--primary);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .match-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.2s;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-card:hover {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        .match-card.selected {
            border-color: var(--primary);
            background: #e0e7ff;
            transform: scale(1.02);
        }

        .match-card.matched {
            opacity: 0.4;
            pointer-events: none;
            background: #d1fae5;
            border-color: var(--success);
        }

        .math-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .reading-text {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            border-radius: 0 10px 10px 0;
            font-size: 1.25rem;
            line-height: 1.5;
            margin-bottom: 15px;
            text-align: right;
            direction: rtl;
        }

        .reading-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reading-option {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            text-align: right;
            direction: rtl;
            transition: all 0.2s;
        }

        .reading-option:hover {
            border-color: var(--primary);
            background: #f5f3ff;
        }

        .reward-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reward-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="rewardPopup" class="reward-popup">
        <span>🏆</span> <span id="rewardText">Новая награда разблокирована!</span>
    </div>

    <div class="container">
        <header>
            <h1>Увлекательные Тренировки</h1>
            <p>Выбирайте категорию и развивайте навыки в игре!</p>
        </header>

        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">⭐ Счёт: <span id="scoreVal">0</span></div>
            <div class="stat-item">🔥 Серия: <span id="streakVal">0</span></div>
            <div class="stat-item">🎯 Успех: <span id="accuracyVal">100%</span></div>
        </div>

        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-info">
                <span>Прогресс обучения</span>
                <span id="progressText">0 / 10 побед</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- ГЛАВНОЕ МЕНЮ: 4 КАТЕГОРИИ -->
        <div id="menuScreen">
            <div class="categories-grid">
                <div class="category-card" onclick="openCategory('english')">
                    <div class="icon">🇬🇧</div>
                    <h3>Английский</h3>
                </div>
                <div class="category-card" onclick="openCategory('hebrew')">
                    <div class="icon">🇮🇱</div>
                    <h3>Иврит</h3>
                </div>
                <div class="category-card" onclick="openCategory('russian')">
                    <div class="icon">🇷🇺</div>
                    <h3>Русский</h3>
                </div>
                <div class="category-card" onclick="openCategory('math')">
                    <div class="icon">🔢</div>
                    <h3>Математика</h3>
                </div>
            </div>

            <div class="rewards-section">
                <h3>🏆 Коллекция наград (набирайте очки!)</h3>
                <div class="rewards-grid" id="rewardsGrid">
                    <div class="reward-badge" data-score="30">🥉</div>
                    <div class="reward-badge" data-score="60">🥈</div>
                    <div class="reward-badge" data-score="100">🥇</div>
                    <div class="reward-badge" data-score="150">🦄</div>
                    <div class="reward-badge" data-score="200">🚀</div>
                    <div class="reward-badge" data-score="300">👑</div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН ВЫБОРА УПРАЖНЕНИЙ ВНУТРИ КАТЕГОРИИ -->
        <div id="exercisesScreen" class="exercises-screen">
            <button class="back-menu-btn" onclick="returnToMainCategoryMenu()">← Назад к категориям</button>
            <h2 id="categoryTitle" style="color: var(--primary); margin-bottom: 15px; font-size: 1.4rem;"></h2>
            <div class="exercise-list" id="exerciseListContainer"></div>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="gameScreen" class="game-container">
            <button class="back-menu-btn" onclick="returnToExercises()">← К списку упражнений</button>
            <div id="gameContent"></div>
        </div>
    </div>

    <script>
        const englishWords = [
            {en: "Cat", ru: "Кошка", emoji: "🐈", weight: 1}, {en: "Dog", ru: "Собака", emoji: "🐕", weight: 1},
            {en: "Apple", ru: "Яблоко", emoji: "🍎", weight: 1}, {en: "House", ru: "Дом", emoji: "🏠", weight: 1},
            {en: "Sun", ru: "Солнце", emoji: "☀️", weight: 1}, {en: "Car", ru: "Машина", emoji: "🚗", weight: 1}
        ];

        const hebrewWords = [
            {he: "כֶּלֶב", translation: "Собака", emoji: "🐕", weight: 1}, {he: "חָתוּל", translation: "Кошка", emoji: "🐈", weight: 1},
            {he: "בַּיִת", translation: "Дом", emoji: "🏠", weight: 1}, {he: "סֵפֶר", translation: "Книга", emoji: "📖", weight: 1}
        ];

        const russianWords = [
            { word: "Солнце", hint: "Светит на небе днем", weight: 1 },
            { word: "Кошка", hint: "Мяукает и любит молоко", weight: 1 },
            { word: "Машина", hint: "Ездит по дороге на колесах", weight: 1 },
            { word: "Яблоко", hint: "Сладкий круглый фрукт", weight: 1 }
        ];

        const englishSentences = [
            { text: "I have a cat", lang: "en-US", translation: "У меня есть кошка" },
            { text: "The sun is red", lang: "en-US", translation: "Солнце красное" },
            { text: "I like big apples", lang: "en-US", translation: "Я люблю большие яблоки" },
            { text: "The dog runs fast", lang: "en-US", translation: "Собака бегает быстро" }
        ];

        const russianSentences = [
            { text: "Кошка пьет молоко", lang: "ru-RU", translation: "Кошка пьет молоко" },
            { text: "Машина едет быстро", lang: "ru-RU", translation: "Машина едет быстро" },
            { text: "Книга лежит на столе", lang: "ru-RU", translation: "Книга лежит на столе" }
        ];

        // Структура упражнений по категориям
        const categoryData = {
            english: {
                title: "🇬🇧 Английский язык",
                exercises: [
                    { id: 'english_words', title: "Английские слова", desc: "Картинки, перевод и озвучка", icon: "🍎" },
                    { id: 'match_pairs', title: "Найди пару", desc: "Соединяй слова и переводы", icon: "🧩" },
                    { id: 'build_sentence_en', title: "Собери предложение", desc: "Прослушай фразу и выложи слова", icon: "✍️" }
                ]
            },
            hebrew: {
                title: "🇮🇱 Иврит",
                exercises: [
                    { id: 'hebrew_words', title: "Слова на иврите", desc: "Учим слова с никудом и озвучкой", icon: "📖" },
                    { id: 'hebrew_reading', title: "Чтение текстов", desc: "Тексты для детей и вопросы", icon: "🇮🇱" }
                ]
            },
            russian: {
                title: "🇷🇺 Русский язык",
                exercises: [
                    { id: 'russian_words', title: "Слушай и угадай слово", desc: "Нажми на динамик и выбери слово", icon: "🔊" },
                    { id: 'build_sentence_ru', title: "Собери предложение", desc: "Составляй русские фразы на слух", icon: "📝" }
                ]
            },
            math: {
                title: "🔢 Математика",
                exercises: [
                    { id: 'math', title: "Примеры и умножение", desc: "Сложение, вычитание и таблица умножения", icon: "🔢" }
                ]
            }
        };

        let currentCategory = null;
        let currentMode = null;
        let score = 0;
        let streak = 0;
        let totalCorrect = 0;
        let totalAttempts = 0;
        let sessionProgress = 0;
        let totalScoreAllTime = parseInt(localStorage.getItem('kids_total_score') || '0');
        let currentQuestionData = null;

        const menuScreen = document.getElementById('menuScreen');
        const exercisesScreen = document.getElementById('exercisesScreen');
        const gameScreen = document.getElementById('gameScreen');
        const statsBar = document.getElementById('statsBar');
        const progressContainer = document.getElementById('progressContainer');
        const scoreVal = document.getElementById('scoreVal');
        const streakVal = document.getElementById('streakVal');
        const accuracyVal = document.getElementById('accuracyVal');
        const progressText = document.getElementById('progressText');
        const progressBarFill = document.getElementById('progressBarFill');
        const gameContent = document.getElementById('gameContent');
        const categoryTitle = document.getElementById('categoryTitle');
        const exerciseListContainer = document.getElementById('exerciseListContainer');

        updateRewardsDisplay();

        function openCategory(catKey) {
            currentCategory = catKey;
            const cat = categoryData[catKey];
            categoryTitle.textContent = cat.title;

            let html = '';
            cat.exercises.forEach(ex => {
                html += `
                    <div class="exercise-card" onclick="startGame('${ex.id}')">
                        <div class="ex-icon">${ex.icon}</div>
                        <div>
                            <h4>${ex.title}</h4>
                            <p>${ex.desc}</p>
                        </div>
                    </div>
                `;
            });
            exerciseListContainer.innerHTML = html;

            menuScreen.style.display = 'none';
            exercisesScreen.style.display = 'block';
        }

        function returnToMainCategoryMenu() {
            exercisesScreen.style.display = 'none';
            menuScreen.style.display = 'block';
            currentCategory = null;
        }

        function startGame(mode) {
            currentMode = mode;
            exercisesScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            statsBar.style.display = 'flex';
            progressContainer.style.display = 'block';
            score = 0;
            streak = 0;
            totalCorrect = 0;
            totalAttempts = 0;
            sessionProgress = 0;
            updateStats();
            updateProgressUI();
            nextQuestion();
        }

        function returnToExercises() {
            gameScreen.style.display = 'none';
            statsBar.style.display = 'none';
            progressContainer.style.display = 'none';
            exercisesScreen.style.display = 'block';
            currentMode = null;
            updateRewardsDisplay();
        }

        function updateStats() {
            scoreVal.textContent = score;
            streakVal.textContent = streak;
            const accuracy = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 100;
            accuracyVal.textContent = accuracy + '%';
        }

        function updateProgressUI() {
            progressText.textContent = `${sessionProgress} / 10 побед`;
            const percent = Math.min((sessionProgress / 10) * 100, 100);
            progressBarFill.style.width = percent + '%';
        }

        function checkRewards(points) {
            totalScoreAllTime += points;
            localStorage.setItem('kids_total_score', totalScoreAllTime);

            const badges = document.querySelectorAll('.reward-badge');
            badges.forEach(badge => {
                const targetScore = parseInt(badge.getAttribute('data-score'));
                if (totalScoreAllTime >= targetScore && !badge.classList.contains('unlocked')) {
                    badge.classList.add('unlocked');
                    showRewardPopup(`Открыта новая награда: ${badge.textContent}! (${targetScore} очков)`);
                }
            });
        }

        function updateRewardsDisplay() {
            const badges = document.querySelectorAll('.reward-badge');
            badges.forEach(badge => {
                const targetScore = parseInt(badge.getAttribute('data-score'));
                if (totalScoreAllTime >= targetScore) {
                    badge.classList.add('unlocked');
                } else {
                    badge.classList.remove('unlocked');
                }
            });
        }

        function showRewardPopup(text) {
            const popup = document.getElementById('rewardPopup');
            document.getElementById('rewardText').textContent = text;
            popup.classList.add('show');
            setTimeout(() => {
                popup.classList.remove('show');
            }, 3500);
        }

        function getWeightedItem(list) {
            let totalWeight = list.reduce((sum, item) => sum + item.weight, 0);
            let randomNum = Math.random() * totalWeight;
            let currentSum = 0;
            for (let item of list) {
                currentSum += item.weight;
                if (randomNum <= currentSum) return item;
            }
            return list[0];
        }

        function nextQuestion() {
            if (currentMode === 'english_words') {
                generateEnglishQuestion();
            } else if (currentMode === 'math') {
                generateMathQuestion();
            } else if (currentMode === 'build_sentence_en') {
                generateBuildSentenceQuestion(englishSentences);
            } else if (currentMode === 'build_sentence_ru') {
                generateBuildSentenceQuestion(russianSentences);
            } else if (currentMode === 'match_pairs') {
                generateMatchPairsQuestion();
            } else if (currentMode === 'hebrew_words') {
                generateHebrewWordQuestion();
            } else if (currentMode === 'hebrew_reading') {
                generateHebrewReadingQuestion();
            } else if (currentMode === 'russian_words') {
                generateRussianWordQuestion();
            }
        }

        function speakText(text, lang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function generateEnglishQuestion() {
            const correctItem = getWeightedItem(englishWords);
            let wrongItems = englishWords.filter(item => item.en !== correctItem.en);
            wrongItems.sort(() => 0.5 - Math.random());
            let options = [correctItem, ...wrongItems.slice(0, 3)];
            options.sort(() => 0.5 - Math.random());

            currentQuestionData = { correctItem };

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <span>${correctItem.en}</span>
                        <button class="speak-btn" onclick="speakText('${correctItem.en}', 'en-US')">🔊</button>
                    </div>
                    <div class="subtitle">Выберите картинку (Перевод: ${correctItem.ru})</div>
                </div>
                <div class="options-grid">
            `;

            options.forEach(opt => {
                html += `
                    <div class="option-card" onclick="handleCardAnswer(this, '${opt.en}', '${correctItem.en}')">
                        <div class="emoji-icon">${opt.emoji}</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">${opt.ru}</div>
                    </div>
                `;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateMathQuestion() {
            const a = Math.floor(Math.random() * 8) + 2;
            const b = Math.floor(Math.random() * 8) + 2;
            const correctAnswer = a * b;
            const questionStr = `${a} × ${b} = ?`;

            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = (Math.floor(Math.random() * 8) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let fake = correctAnswer + offset;
                if (fake > 0 && !options.includes(fake)) {
                    options.push(fake);
                }
            }
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">${questionStr}</div>
                    <div class="subtitle">Решите пример</div>
                </div>
                <div class="options-grid math-grid">
            `;

            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.5rem;" onclick="handleMathAnswer(this, ${opt}, ${correctAnswer})">
                        ${opt}
                    </div>
                `;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }

        let currentSentenceObj = null;
        let userConstructedWords = [];

        function generateBuildSentenceQuestion(bank) {
            currentSentenceObj = bank[Math.floor(Math.random() * bank.length)];
            userConstructedWords = [];

            setTimeout(() => speakText(currentSentenceObj.text, currentSentenceObj.lang), 300);

            const originalWords = currentSentenceObj.text.split(' ');
            let shuffledWords = [...originalWords].sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <span>Собери предложение</span>
                        <button class="speak-btn" onclick="speakText('${currentSentenceObj.text}', '${currentSentenceObj.lang}')">🔊</button>
                    </div>
                    <div class="subtitle">Подсказка: ${currentSentenceObj.translation}</div>
                </div>
                <div class="sentence-drop-zone" id="dropZone" onclick="resetSentenceBuild()">
                    <span style="color: #94a3b8; font-size: 0.95rem;">Нажмите на слова в нужном порядке</span>
                </div>
                <div class="word-pool" id="wordPool">
            `;

            shuffledWords.forEach((word, index) => {
                html += `<div class="word-chip" id="chip-${index}" onclick="selectWordChip('${word}', 'chip-${index}')">${word}</div>`;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function selectWordChip(word, chipId) {
            userConstructedWords.push({ word, chipId });
            document.getElementById(chipId).classList.add('used');
            renderDropZone();

            const originalWords = currentSentenceObj.text.split(' ');
            if (userConstructedWords.length === originalWords.length) {
                totalAttempts++;
                const userString = userConstructedWords.map(item => item.word).join(' ');

                if (userString === currentSentenceObj.text) {
                    score += 15;
                    streak += 1;
                    totalCorrect++;
                    sessionProgress++;
                    checkRewards(15);
                    updateStats();
                    updateProgressUI();

                    document.getElementById('dropZone').style.borderColor = 'var(--success)';
                    document.getElementById('dropZone').style.background = '#d1fae5';

                    setTimeout(() => generateBuildSentenceQuestion(currentMode === 'build_sentence_en' ? englishSentences : russianSentences), 1300);
                } else {
                    streak = 0;
                    updateStats();
                    document.getElementById('dropZone').style.borderColor = 'var(--error)';
                    document.getElementById('dropZone').style.background = '#fee2e2';

                    setTimeout(() => resetSentenceBuild(), 1000);
                }
            }
        }

        function renderDropZone() {
            const dropZone = document.getElementById('dropZone');
            if (userConstructedWords.length === 0) {
                dropZone.innerHTML = `<span style="color: #94a3b8; font-size: 0.95rem;">Нажмите на слова в нужном порядке</span>`;
                return;
            }

            let html = '';
            userConstructedWords.forEach(item => {
                html += `<div class="selected-word-chip" onclick="returnWordChip('${item.chipId}')">${item.word}</div>`;
            });
            dropZone.innerHTML = html;
        }

        function returnWordChip(chipId) {
            userConstructedWords = userConstructedWords.filter(item => item.chipId !== chipId);
            document.getElementById(chipId).classList.remove('used');
            renderDropZone();
            document.getElementById('dropZone').style.borderColor = '#cbd5e1';
            document.getElementById('dropZone').style.background = '#f1f5f9';
        }

        function resetSentenceBuild() {
            userConstructedWords.forEach(item => {
                document.getElementById(item.chipId).classList.remove('used');
            });
            userConstructedWords = [];
            renderDropZone();
            document.getElementById('dropZone').style.borderColor = '#cbd5e1';
            document.getElementById('dropZone').style.background = '#f1f5f9';
        }

        function handleCardAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (selected === correct) {
                element.classList.add('correct');
                score += element.dataset.failed ? 5 : 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();

                if (currentQuestionData && currentQuestionData.correctItem) {
                    currentQuestionData.correctItem.weight = Math.max(1, currentQuestionData.correctItem.weight - 0.5);
                }

                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1200);
            } else {
                if (!element.dataset.failed && !parent.dataset.secondChanceFailed) {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    element.dataset.failed = "true";
                    parent.dataset.secondChanceFailed = "true";
                    streak = 0;
                    updateStats();
                } else {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();

                    if (currentQuestionData && currentQuestionData.correctItem) {
                        currentQuestionData.correctItem.weight += 2;
                    }

                    highlightCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1500);
                }
            }
        }

        function handleMathAnswer(element, selected, correct) {
            totalAttempts++;
            const parent = element.parentElement;

            if (selected === correct) {
                element.classList.add('correct');
                score += element.dataset.failed ? 5 : 10;
                streak += 1;
                totalCorrect++;
                sessionProgress++;
                checkRewards(10);
                updateStats();
                updateProgressUI();
                disableAllCards(parent);
                setTimeout(() => nextQuestion(), 1200);
            } else {
                if (!element.dataset.failed && !parent.dataset.secondChanceFailed) {
                    element.classList.add('incorrect');
                    element.style.pointerEvents = 'none';
                    element.dataset.failed = "true";
                    parent.dataset.secondChanceFailed = "true";
                    streak = 0;
                    updateStats();
                } else {
                    element.classList.add('incorrect');
                    streak = 0;
                    updateStats();
                    highlightMathCorrectCard(parent, correct);
                    disableAllCards(parent);
                    setTimeout(() => nextQuestion(), 1500);
                }
            }
        }

        function disableAllCards(parent) {
            for (let card of parent.children) {
                card.style.pointerEvents = 'none';
            }
        }

        function highlightCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (currentMode === 'english_words' || currentMode === 'hebrew_words') {
                    if (card.getAttribute('onclick')?.includes(correct)) {
                        card.classList.add('correct');
                    }
                } else if (currentMode === 'russian_words') {
                    if (card.textContent.trim() === String(correct)) {
                        card.classList.add('correct');
                    }
                }
            }
        }

        function highlightMathCorrectCard(parent, correct) {
            for (let card of parent.children) {
                if (card.textContent.trim() == String(correct)) {
                    card.classList.add('correct');
                }
            }
        }

        let selectedPairCard = null;
        let matchedPairsCount = 0;

        function generateMatchPairsQuestion() {
            selectedPairCard = null;
            matchedPairsCount = 0;

            let shuffled = [...englishWords].sort(() => 0.5 - Math.random());
            let currentPairs = shuffled.slice(0, 4);

            let cardsData = [];
            currentPairs.forEach(item => {
                cardsData.push({ text: item.en, type: 'en', pairId: item.en });
                cardsData.push({ text: item.ru, type: 'ru', pairId: item.en });
            });
            cardsData.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div class="question-title">Найди пару</div>
                    <div class="subtitle">Нажми на слово, а затем на его перевод</div>
                </div>
                <div class="match-grid" id="matchGrid">
            `;

            cardsData.forEach((card) => {
                html += `
                    <div class="match-card" onclick="handleMatchClick(this, '${card.pairId}', '${card.type}')">
                        ${card.text}
                    </div>
                `;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function handleMatchClick(element, pairId, type) {
            if (element.classList.contains('matched') || element.classList.contains('selected')) return;

            if (!selectedPairCard) {
                selectedPairCard = { element, pairId, type };
                element.classList.add('selected');
            } else {
                totalAttempts++;
                if (selectedPairCard.type !== type && selectedPairCard.pairId === pairId) {
                    selectedPairCard.element.classList.remove('selected');
                    selectedPairCard.element.classList.add('matched');
                    element.classList.add('matched');
                    selectedPairCard = null;
                    matchedPairsCount++;

                    score += 5;
                    totalCorrect++;
                    updateStats();

                    if (matchedPairsCount === 4) {
                        sessionProgress++;
                        updateProgressUI();
                        checkRewards(20);
                        setTimeout(() => generateMatchPairsQuestion(), 1000);
                    }
                } else {
                    selectedPairCard.element.classList.add('incorrect');
                    element.classList.add('incorrect');
                    let prevSelected = selectedPairCard.element;
                    selectedPairCard = null;
                    streak = 0;
                    updateStats();

                    setTimeout(() => {
                        prevSelected.classList.remove('incorrect', 'selected');
                        element.classList.remove('incorrect');
                    }, 600);
                }
            }
        }

        function generateHebrewWordQuestion() {
            const correctItem = getWeightedItem(hebrewWords);
            let wrongItems = hebrewWords.filter(item => item.he !== correctItem.he);
            wrongItems.sort(() => 0.5 - Math.random());
            let options = [correctItem, ...wrongItems.slice(0, 3)];
            options.sort(() => 0.5 - Math.random());

            currentQuestionData = { correctItem };

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <span style="direction: rtl;">${correctItem.he}</span>
                        <button class="speak-btn" onclick="speakText('${correctItem.he}', 'he-IL')">🔊</button>
                    </div>
                    <div class="subtitle">Выберите картинку (${correctItem.translation})</div>
                </div>
                <div class="options-grid">
            `;

            options.forEach(opt => {
                html += `
                    <div class="option-card" onclick="handleCardAnswer(this, '${opt.he}', '${correctItem.he}')">
                        <div class="emoji-icon">${opt.emoji}</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted);">${opt.translation}</div>
                    </div>
                `;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateHebrewReadingQuestion() {
            const item = {text: "הַיֶּלֶד דָּוִד שׁוֹתֶה חָלָב חַם בַּבֹּקֶר.", question: "מָה שׁוֹתֶה דָּוִד?", correct: "חָלָב חַם", options: ["חָלָב חַם", "מַיִם קָרִים", "מִיץ תַּפּוּחִים", "תֵּה מְתוֹק"]};
            let options = [...item.options];
            options.sort(() => 0.5 - Math.random());

            let html = `
                <div class="question-box">
                    <div style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 10px;">
                        <button class="speak-btn" onclick="speakText('${item.text}', 'he-IL')">🔊 Прослушать</button>
                    </div>
                    <div class="reading-text">${item.text}</div>
                    <div style="font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; direction: rtl;">${item.question}</div>
                </div>
                <div class="reading-options">
            `;

            options.forEach(opt => {
                html += `
                    <div class="reading-option" onclick="handleCardAnswer(this, '${opt}', '${item.correct}')">
                        ${opt}
                    </div>
                `;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }

        function generateRussianWordQuestion() {
            const correctItem = getWeightedItem(russianWords);
            let wrongItems = russianWords.filter(item => item.word !== correctItem.word);
            wrongItems.sort(() => 0.5 - Math.random());
            
            let options = [correctItem.word, wrongItems[0].word, wrongItems[1].word, wrongItems[2].word];
            options.sort(() => 0.5 - Math.random());

            currentQuestionData = { correctItem };

            let html = `
                <div class="question-box">
                    <div class="question-title">
                        <span>Что прозвучало?</span>
                        <button class="speak-btn" onclick="speakText('${correctItem.word}', 'ru-RU')">🔊</button>
                    </div>
                    <div class="subtitle">Подсказка: ${correctItem.hint}</div>
                </div>
                <div class="options-grid">
            `;

            options.forEach(opt => {
                html += `
                    <div class="option-card" style="font-size: 1.3rem;" onclick="handleCardAnswer(this, '${opt}', '${correctItem.word}')">
                        ${opt}
                    </div>
                `;
            });

            html += `</div>`;
            gameContent.innerHTML = html;
        }
    </script>
</body>
</html>
